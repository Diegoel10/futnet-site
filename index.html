<!-- SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithRedirect, getRedirectResult, GoogleAuthProvider, FacebookAuthProvider, TwitterAuthProvider, OAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let app, auth, db, appId, currentUser = null;
        let userProfile = null;
        let eventsList = [];
        let chatsThreads = [];
        let activeChatThreadId = null;
        let friendsList = [];
        let recentlyMetList = [];
        let sentRequestsList = [];
        let receivedRequestsList = [];
        let directoryList = [];
        let activeEventId = null;
        let activeEventTab = 'info';
        let activeStatsSubTab = 'matches';
        let selectedDateStr = '2026-08-18';
        let unsubscribeListeners = [];
        let typingTimeout = null;

        function calculateAge(dobString) {
            if (!dobString) return 'Prefer not to say';
            const today = new Date();
            const birthDate = new Date(dobString);
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age > 0 ? `${age} yrs` : 'Prefer not to say';
        }

        window.triggerPhotoUpload = (type) => document.getElementById(type === 'unified' ? 'unified-file-input' : 'profile-file-input').click();

        window.handleImageSelection = function(event, type) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    let base64Url = e.target.result;
                    const img = new Image();
                    img.src = base64Url;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 40;
                        canvas.height = 40;
                        ctx.drawImage(img, 0, 0, 40, 40);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.2);
                        saveImageToState(compressedBase64, type);
                    };
                };
                reader.readAsDataURL(file);
            }
        };

        function saveImageToState(base64Url, type) {
            if (type === 'unified') {
                document.getElementById('unified-avatar').value = base64Url;
                const preview = document.getElementById('unified-avatar-preview');
                preview.src = base64Url;
                preview.classList.remove('hidden');
                document.getElementById('unified-placeholder-icon').classList.add('hidden');
            } else {
                userProfile.avatar = base64Url;
                document.getElementById('profile-tab-avatar').src = base64Url;
                document.getElementById('header-avatar').src = base64Url;
                setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'data'), userProfile);
                setDoc(doc(db, 'artifacts', appId, 'directory', currentUser.uid), userProfile);
            }
            showToast("Photo uploaded successfully!");
        }

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto bg-[#0f1523] border ${type === 'success' ? 'border-brand text-emerald-400' : 'border-red-500 text-red-400'} px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-xs font-semibold`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        };

        window.onload = async function() {
            try {
                const firebaseConfig = {
                    apiKey: "AIzaSyCF_6foG4Y9Pq9FSbFcpKaoQNi2I_MQiAg",
                    authDomain: "futnetsite-de7c3.firebaseapp.com",
                    projectId: "futnetsite-de7c3",
                    storageBucket: "futnetsite-de7c3.firebasestorage.app",
                    messagingSenderId: "540556709101",
                    appId: "1:540556709101:web:31d653e4b6d50d67a390e4",
                    measurementId: "G-8BFTQ9HWCY"
                };
                appId = 'futnetsite-de7c3';
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Enforce browser-local persistence so sessions survive page refreshes and browser restarts
                await setPersistence(auth, browserLocalPersistence);

                // Explicitly process the redirect result for custom domains on static hosts
                try {
                    const result = await getRedirectResult(auth);
                    if (result && result.user) {
                        currentUser = result.user;
                    }
                } catch (redirectErr) {
                    console.error("Redirect login error:", redirectErr);
                }

                onAuthStateChanged(auth, async (user) => {
                    currentUser = user;
                    if (user) {
                        try {
                            const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                            const docSnap = await getDoc(docRef);
                            if (docSnap.exists()) {
                                userProfile = docSnap.data();
                                
                                if (!userProfile.avatar && user.photoURL) {
                                    userProfile.avatar = user.photoURL;
                                    await setDoc(docRef, userProfile);
                                }

                                await setDoc(doc(db, 'artifacts', appId, 'directory', currentUser.uid), userProfile);
                                setupRealtimeListeners();
                                initAppDashboard();
                            } else {
                                showAuthScreen('signup');
                            }
                        } catch (err) {
                            console.error("Firestore profile check error:", err);
                        }
                    } else {
                        showAuthScreen('login');
                    }
                });
            } catch (err) {
                showAuthScreen('login');
            }
        };

        function setupRealtimeListeners() {
            unsubscribeListeners.forEach(unsub => unsub());
            unsubscribeListeners = [];

            const dirUnsub = onSnapshot(collection(db, 'artifacts', appId, 'directory'), (snapshot) => {
                directoryList = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.uid !== currentUser.uid) {
                        directoryList.push(data);
                    }
                });
                renderFriends();
            });
            unsubscribeListeners.push(dirUnsub);

            const relDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'relationships', 'data');
            const relUnsub = onSnapshot(relDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const relData = docSnap.data();
                    friendsList = relData.friends || [];
                    sentRequestsList = relData.sentRequests || [];
                    receivedRequestsList = relData.receivedRequests || [];
                    renderFriends();
                    updateBadges();
                }
            });
            unsubscribeListeners.push(relUnsub);

            const chatDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'chats', 'data');
            const chatUnsub = onSnapshot(chatDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    chatsThreads = docSnap.data().threads || [];
                    renderChatsList();
                    if (activeChatThreadId) {
                        renderActiveChatMessages();
                    }
                    updateBadges();
                }
            });
            unsubscribeListeners.push(chatUnsub);

            const eventsDocRef = doc(db, 'artifacts', appId, 'global', 'events');
            const eventsUnsub = onSnapshot(eventsDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    eventsList = docSnap.data().list || [];
                    renderEvents();
                    if (activeEventId) {
                        openEventDetail(activeEventId, activeEventTab);
                    }
                }
            });
            unsubscribeListeners.push(eventsUnsub);
        }

        function updateBadges() {
            const friendsBadge = document.getElementById('friends-badge');
            const pendingCount = receivedRequestsList.length;
            if (pendingCount > 0) {
                friendsBadge.innerText = pendingCount;
                friendsBadge.classList.remove('hidden');
            } else {
                friendsBadge.classList.add('hidden');
            }

            const chatsBadge = document.getElementById('chats-badge');
            const unreadCount = chatsThreads.length;
            if (unreadCount > 0) {
                chatsBadge.innerText = unreadCount;
                chatsBadge.classList.remove('hidden');
            } else {
                chatsBadge.classList.add('hidden');
            }
        }

        function showAuthScreen(screen) {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('view-login').classList.toggle('hidden', screen !== 'login');
            document.getElementById('view-signup').classList.toggle('hidden', screen !== 'signup');
            document.getElementById('main-container').classList.add('hidden');
        }

        window.showLoginScreen = () => showAuthScreen('login');
        window.showSignupScreen = () => showAuthScreen('signup');

        window.handleSocialAuth = async function(providerType) {
            let provider;
            if (providerType === 'google') provider = new GoogleAuthProvider();
            else if (providerType === 'facebook') provider = new FacebookAuthProvider();
            else if (providerType === 'x') provider = new TwitterAuthProvider();
            else if (providerType === 'apple') provider = new OAuthProvider('apple.com');

            try {
                await signInWithRedirect(auth, provider);
            } catch (error) {
                showToast(error.message, 'error');
            }
        };

        window.handleEmailAuth = async function(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                const userCred = await signInWithEmailAndPassword(auth, email, pass);
                currentUser = userCred.user;
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'data');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    userProfile = docSnap.data();
                    await setDoc(doc(db, 'artifacts', appId, 'directory', currentUser.uid), userProfile);
                    setupRealtimeListeners();
                    initAppDashboard();
                } else {
                    showAuthScreen('signup');
                }
            } catch (error) {
                const el = document.getElementById('login-error-msg');
                el.innerText = error.message;
                el.classList.remove('hidden');
            }
        };

        window.handleUnifiedRegistration = async function(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            const errEl = document.getElementById('signup-error-msg');

            if (pass !== confirm) {
                errEl.innerText = "Passwords do not match";
                errEl.classList.remove('hidden');
                return;
            }

            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                currentUser = userCred.user;

                let avatarVal = document.getElementById('unified-avatar').value;
                if (!avatarVal || avatarVal.length < 10) {
                    avatarVal = currentUser?.photoURL || "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100";
                }

                userProfile = {
                    uid: currentUser.uid,
                    firstName: document.getElementById('reg-firstname').value,
                    lastName: document.getElementById('reg-lastname').value,
                    nickname: document.getElementById('reg-nickname').value || '',
                    email: email,
                    avatar: avatarVal,
                    gender: document.getElementById('reg-gender').value,
                    dob: document.getElementById('reg-dob').value,
                    position: document.getElementById('reg-position').value,
                    isOrganizer: true,
                    played: 0, wins: 0, goals: 0
                };

                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'data');
                await setDoc(docRef, userProfile);
                await setDoc(doc(db, 'artifacts', appId, 'directory', currentUser.uid), userProfile);

                setupRealtimeListeners();
                initAppDashboard();
                showToast("Account & profile created successfully!");
            } catch (error) {
                console.error("Registration error:", error);
                userProfile = {
                    uid: currentUser.uid,
                    firstName: document.getElementById('reg-firstname').value,
                    lastName: document.getElementById('reg-lastname').value,
                    nickname: document.getElementById('reg-nickname').value || '',
                    email: email,
                    avatar: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100",
                    gender: document.getElementById('reg-gender').value,
                    dob: document.getElementById('reg-dob').value,
                    position: document.getElementById('reg-position').value,
                    isOrganizer: true,
                    played: 0, wins: 0, goals: 0
                };
                setupRealtimeListeners();
                initAppDashboard();
                showToast("Account created successfully!");
            }
        };

        function initAppDashboard() {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('main-container').classList.remove('hidden');

            document.getElementById('header-username').innerText = `${userProfile.firstName} ${userProfile.lastName}`;
            document.getElementById('header-avatar').src = userProfile.avatar || 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100';

            const calculatedAge = calculateAge(userProfile.dob);
            document.getElementById('profile-tab-name').innerText = `${userProfile.firstName} ${userProfile.lastName}`;
            document.getElementById('profile-tab-email').innerText = userProfile.email || 'player@futnet.com';
            document.getElementById('profile-tab-avatar').src = userProfile.avatar || 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100';
            document.getElementById('profile-tab-position').innerText = `Position: ${userProfile.position}`;
            document.getElementById('profile-tab-gender').innerText = `Gender: ${userProfile.gender || 'Male'}`;
            document.getElementById('profile-tab-age').innerText = `Age: ${calculatedAge}`;

            document.getElementById('tab-edit-firstname').value = userProfile.firstName;
            document.getElementById('tab-edit-lastname').value = userProfile.lastName;
            document.getElementById('tab-edit-gender').value = userProfile.gender || 'Male';
            document.getElementById('tab-edit-dob').value = userProfile.dob || '';
            document.getElementById('tab-edit-position').value = userProfile.position || 'Forward';

            renderDateTabs();
            renderEvents();
            renderLeaderboard();
            renderFriends();
            renderChatsList();
        }

        window.handleLogout = async function() {
            unsubscribeListeners.forEach(unsub => unsub());
            if (auth) await signOut(auth);
            currentUser = null;
            userProfile = null;
            showAuthScreen('login');
        };

        window.switchTab = function(tabName) {
            ['events', 'friends', 'leaderboard', 'chat', 'profile'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (el) el.classList.add('hidden');
                const btn = document.getElementById(`nav-btn-${t}`);
                if (btn) {
                    btn.className = "px-5 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white flex items-center gap-2 relative";
                }
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`nav-btn-${tabName}`);
            if (activeBtn) {
                activeBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition bg-brand text-slate-950 shadow flex items-center gap-2";
            }
            if (tabName === 'chat') {
                renderChatsList();
            }
        };

        window.toggleCreateEventModal = function(show) {
            document.getElementById('modal-create-event').classList.toggle('hidden', !show);
        };

        window.handleCreateEvent = async function(e) {
            e.preventDefault();
            const newEvent = {
                id: 'evt_' + Date.now(),
                title: document.getElementById('ce-title').value,
                visibility: document.getElementById('ce-visibility').value,
                date: document.getElementById('ce-date').value,
                time: document.getElementById('ce-time').value,
                location: `${document.getElementById('ce-parkname').value} (${document.getElementById('ce-city').value}, ${document.getElementById('ce-state').value})`,
                description: document.getElementById('ce-description').value || 'Friendly match.',
                rules: document.getElementById('ce-rules').value || 'Standard fair play rules.',
                format: document.getElementById('ce-format').value,
                teamsCount: parseInt(document.getElementById('ce-teams-count').value),
                fee: parseFloat(document.getElementById('ce-fee').value),
                organizer: `${userProfile.firstName} ${userProfile.lastName}`,
                organizerAvatar: userProfile.avatar,
                organizerId: userProfile.uid,
                attendees: [{ uid: userProfile.uid, name: `${userProfile.firstName} ${userProfile.lastName}`, avatar: userProfile.avatar, role: 'Organizer', status: 'confirmed' }],
                waitingList: [],
                declinedList: [],
                invitedList: [{ uid: 'inv_1', name: 'Invited Friend Test' }],
                comments: [],
                teams: Array.from({length: parseInt(document.getElementById('ce-teams-count').value)}, (_, i) => ({ name: `Team ${i+1}`, players: [] })),
                matches: []
            };
            
            try {
                const docRef = doc(db, 'artifacts', appId, 'global', 'events');
                const docSnap = await getDoc(docRef);
                let currentList = docSnap.exists() ? (docSnap.data().list || []) : [];
                currentList.unshift(newEvent);
                await setDoc(docRef, { list: currentList });
                eventsList = currentList;
            } catch (err) {
                eventsList.unshift(newEvent);
                await setDoc(doc(db, 'artifacts', appId, 'global', 'events'), { list: eventsList });
            }

            toggleCreateEventModal(false);
            showToast("Game successfully created!");
            switchTab('events');
        };

        window.renderDateTabs = function() {
            const container = document.getElementById('date-tabs-container');
            const dates = [
                { date: "2026-08-15", label: "Aug 15", sub: "Sat" },
                { date: "2026-08-16", label: "Aug 16", sub: "Sun" },
                { date: "2026-08-17", label: "Yesterday", sub: "Mon" },
                { date: "2026-08-18", label: "Today", sub: "Tue, Aug 18", active: true },
                { date: "2026-08-19", label: "Tomorrow", sub: "Wed, Aug 19" },
                { date: "2026-08-20", label: "Aug 20", sub: "Thu" },
                { date: "2026-08-21", label: "Aug 21", sub: "Fri" },
                { date: "2026-08-22", label: "Aug 22", sub: "Sat" }
            ];
            container.innerHTML = dates.map(d => `
                <div onclick="selectDateTab('${d.date}')" class="px-4 py-2.5 rounded-xl text-center cursor-pointer transition ${selectedDateStr === d.date ? 'bg-brand text-slate-950 font-bold shadow-lg' : 'bg-[#090d16] text-slate-400 hover:text-white border border-slate-800'}">
                    <div class="text-xs font-black">${d.label}</div>
                    <div class="text-[10px] opacity-80">${d.sub}</div>
                </div>
            `).join('');
        };

        window.selectDateTab = function(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('selected-date-title').innerText = `Games for ${dateStr}`;
            renderDateTabs();
            renderEvents();
        };

        window.shiftDateCarousel = function(dir) {};

        window.renderEvents = function() {
            const grid = document.getElementById('events-grid');
            const filteredEvents = eventsList.filter(ev => ev.date === selectedDateStr);

            if (filteredEvents.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-[#0f1523] border border-slate-800/80 rounded-2xl p-12 text-center space-y-6 shadow-xl">
                        <div class="space-y-2 max-w-sm mx-auto">
                            <h3 class="text-lg font-black text-white">No games scheduled for this date</h3>
                            <p class="text-slate-400 text-xs">Looks like there aren't any games planned yet. Be the first to create one!</p>
                        </div>
                        <div>
                            <button onclick="toggleCreateEventModal(true)" class="bg-brand hover:bg-brand-dark text-slate-950 font-black px-6 py-3 rounded-xl text-xs uppercase tracking-wider transition shadow-lg inline-flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i> Create Game
                            </button>
                        </div>
                    </div>
                `;
                return;
            }
            grid.innerHTML = filteredEvents.map(ev => {
                const joinedCount = (ev.attendees || []).length;
                let playersPerTeam = 7;
                if (ev.format) {
                    const matchFormat = ev.format.match(/(\d+)v/);
                    if (matchFormat && matchFormat[1]) playersPerTeam = parseInt(matchFormat[1]);
                }
                const teamsCount = ev.teamsCount || 3;
                const dynamicMaxCapacity = playersPerTeam * teamsCount;
                const isAlreadyJoined = (ev.attendees || []).some(a => a.uid === userProfile?.uid);

                return `
                    <div onclick="openEventDetail('${ev.id}')" class="bg-[#0f1523] border border-slate-800 hover:border-brand/60 cursor-pointer rounded-2xl p-6 space-y-4 shadow-2xl transition transform hover:-translate-y-1 hover:shadow-brand/10 duration-200 relative overflow-hidden group col-span-full">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-brand/5 rounded-bl-full pointer-events-none group-hover:bg-brand/10 transition"></div>
                        
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-black uppercase bg-brand/20 text-emerald-400 px-3 py-1 rounded-xl tracking-wider">${ev.format || '7v7'}</span>
                            <span class="text-xs font-bold text-slate-400 flex items-center gap-1.5"><i class="fa-solid fa-earth-americas text-brand"></i> ${ev.visibility || 'Public'}</span>
                        </div>

                        <div>
                            <h3 class="text-2xl font-black text-white group-hover:text-emerald-400 transition">${ev.title}</h3>
                        </div>

                        <div class="flex items-center justify-between bg-[#090d16] px-4 py-2.5 rounded-xl border border-slate-800/60 text-xs">
                            <div class="flex items-center gap-2.5">
                                <img src="${ev.organizerAvatar || 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100'}" class="w-7 h-7 rounded-full object-cover border border-brand">
                                <span class="text-slate-300 font-semibold">Creator: <strong class="text-white">${ev.organizer}</strong></span>
                            </div>
                            <span class="font-bold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-lg border border-emerald-500/20">${joinedCount}/${dynamicMaxCapacity}</span>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 text-xs text-slate-300">
                            <div class="flex items-center gap-2.5 bg-[#090d16] p-3 rounded-xl border border-slate-800/60">
                                <span class="text-base">📅</span>
                                <div>
                                    <span class="text-[9px] text-slate-500 uppercase block font-semibold">Date</span>
                                    <span class="font-bold text-white">${ev.date}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2.5 bg-[#090d16] p-3 rounded-xl border border-slate-800/60">
                                <span class="text-base">⏰</span>
                                <div>
                                    <span class="text-[9px] text-slate-500 uppercase block font-semibold">Time</span>
                                    <span class="font-bold text-white">${ev.time || '20:00'}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2.5 bg-[#090d16] p-3 rounded-xl border border-slate-800/60">
                                <span class="text-base">⚽</span>
                                <div>
                                    <span class="text-[9px] text-slate-500 uppercase block font-semibold">Format</span>
                                    <span class="font-bold text-white">${ev.format || '7v7'}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-3 border-t border-slate-800/80">
                            <span class="text-xs font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-users text-brand"></i> ${joinedCount}/${dynamicMaxCapacity}</span>
                            ${isAlreadyJoined ? `
                                <button onclick="toggleJoinCancelGame('${ev.id}'); event.stopPropagation();" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 font-bold px-6 py-2.5 rounded-xl text-xs transition border border-red-500/40">Cancel (RSVP No)</button>
                            ` : `
                                <button onclick="toggleJoinCancelGame('${ev.id}'); event.stopPropagation();" class="bg-brand hover:bg-brand-dark text-slate-950 font-black px-6 py-2.5 rounded-xl text-xs transition shadow-lg">Join Game</button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.toggleJoinCancelGame = async function(eventId) {
            const ev = eventsList.find(e => e.id === eventId);
            if (!ev || !userProfile) return;

            const isJoined = (ev.attendees || []).some(a => a.uid === userProfile.uid);
            if (isJoined) {
                ev.attendees = ev.attendees.filter(a => a.uid !== userProfile.uid);
                if (!ev.declinedList) ev.declinedList = [];
                if (!ev.declinedList.some(d => d.uid === userProfile.uid)) {
                    ev.declinedList.push({ uid: userProfile.uid, name: `${userProfile.firstName} ${userProfile.lastName}` });
                }
                showToast("Cancelled attendance (RSVP No).");
            } else {
                ev.declinedList = (ev.declinedList || []).filter(d => d.uid !== userProfile.uid);
                let playersPerTeam = 7;
                if (ev.format) {
                    const matchFormat = ev.format.match(/(\d+)v/);
                    if (matchFormat && matchFormat[1]) playersPerTeam = parseInt(matchFormat[1]);
                }
                const maxCapacity = playersPerTeam * (ev.teamsCount || 3);

                const newAttendee = { uid: userProfile.uid, name: `${userProfile.firstName} ${userProfile.lastName}`, avatar: userProfile.avatar, role: 'Player', status: 'confirmed' };
                if (ev.attendees.length >= maxCapacity) {
                    if (!ev.waitingList) ev.waitingList = [];
                    ev.waitingList.push(newAttendee);
                    showToast("Game is full. Added to waiting list!", "error");
                } else {
                    ev.attendees.push(newAttendee);
                    showToast("Successfully joined the match!");
                }
            }
            await setDoc(doc(db, 'artifacts', appId, 'global', 'events'), { list: eventsList });
            renderEvents();
            if (activeEventId === eventId) {
                openEventDetail(eventId, activeEventTab);
            }
        };

        window.openEventDetail = function(eventId, tab = 'info') {
            activeEventId = eventId;
            activeEventTab = tab;
            const ev = eventsList.find(e => e.id === eventId);
            if (!ev) return;

            const isOrganizer = ev.organizerId === userProfile.uid;
            const isAlreadyJoined = (ev.attendees || []).some(a => a.uid === userProfile?.uid);

            const content = document.getElementById('modal-event-content');
            content.innerHTML = `
                <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                    <div>
                        <div class="flex items-center gap-2">
                            <h3 class="text-lg font-black text-white">${ev.title}</h3>
                            <span class="text-[10px] uppercase font-bold bg-brand/20 text-brand px-2 py-0.5 rounded">${ev.visibility || 'Public'}</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-location-dot text-brand mr-1"></i>${ev.location}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="openShareModal()" class="bg-brand hover:bg-brand-dark text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-share-nodes"></i> Share
                        </button>
                        <button onclick="document.getElementById('modal-event-detail').classList.add('hidden')" class="text-slate-400 hover:text-white p-1.5"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                </div>

                <div class="flex bg-[#090d16] p-1.5 rounded-xl border border-slate-800 gap-1 overflow-x-auto text-xs font-bold">
                    ${isOrganizer ? `<button onclick="openEventDetail('${ev.id}', 'admin')" class="flex-1 py-2 px-3 rounded-lg transition ${activeEventTab === 'admin' ? 'bg-brand text-slate-950' : 'text-slate-400 hover:text-white'}"><i class="fa-solid fa-gear mr-1"></i> Admin</button>` : ''}
                    <button onclick="openEventDetail('${ev.id}', 'info')" class="flex-1 py-2 px-3 rounded-lg transition ${activeEventTab === 'info' ? 'bg-brand text-slate-950' : 'text-slate-400 hover:text-white'}">Game Info</button>
                    <button onclick="openEventDetail('${ev.id}', 'roster')" class="flex-1 py-2 px-3 rounded-lg transition ${activeEventTab === 'roster' ? 'bg-brand text-slate-950' : 'text-slate-400 hover:text-white'}">Roster (${(ev.attendees || []).length})</button>
                    <button onclick="openEventDetail('${ev.id}', 'stats')" class="flex-1 py-2 px-3 rounded-lg transition ${activeEventTab === 'stats' ? 'bg-brand text-slate-950' : 'text-slate-400 hover:text-white'}">Game Stats</button>
                    <button onclick="openEventDetail('${ev.id}', 'comments')" class="flex-1 py-2 px-3 rounded-lg transition ${activeEventTab === 'comments' ? 'bg-brand text-slate-950' : 'text-slate-400 hover:text-white'}">Comments (${(ev.comments || []).length})</button>
                </div>
            `;
            document.getElementById('modal-event-detail').classList.remove('hidden');
        };

        window.renderLeaderboard = function() {
            document.getElementById('leaderboard-tbody').innerHTML = `
                <tr>
                    <td class="p-4 font-black text-amber-400">#1</td>
                    <td class="p-4 font-bold text-white flex items-center gap-2">
                        <img src="${userProfile.avatar}" class="w-6 h-6 rounded-full object-cover">
                        <span>${userProfile.firstName} ${userProfile.lastName}</span>
                    </td>
                    <td class="p-4 text-center text-slate-300 text-xs">${userProfile.position}</td>
                    <td class="p-4 text-center text-slate-300">${userProfile.played}</td>
                    <td class="p-4 text-right font-black text-brand">${userProfile.goals}</td>
                </tr>
            `;
        };

        window.renderFriends = function() {
            document.getElementById('my-friends-list').innerHTML = friendsList.length === 0 ? '<p class="text-xs text-slate-500 italic">No squad members added yet.</p>' : friendsList.map(f => `
                <div class="flex items-center justify-between bg-[#090d16] p-3 rounded-xl border border-slate-800">
                    <div class="flex items-center gap-2.5">
                        <img src="${f.avatar}" class="w-9 h-9 rounded-full object-cover">
                        <div>
                            <h4 class="text-xs font-bold text-white">${f.firstName} ${f.lastName}</h4>
                            <span class="text-[10px] text-brand">Squad Member</span>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        window.renderChatsList = function() {};
    </script>
</body>
</html>
